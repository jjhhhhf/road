<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>路口排雷</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="loading-logo">路口<span>排雷</span></div>
  <div class="loading-spinner"></div>
  <div class="loading-hint">連線中，請稍候…</div>
</div>

<!-- Auth Overlay -->
<div id="auth-overlay" class="hidden">
  <div class="auth-box">
    <div class="auth-logo">路口<span>排雷</span></div>
    <div class="auth-subtitle">交通缺陷共筆地圖</div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登入</button>
      <button class="auth-tab" data-tab="register">註冊</button>
    </div>
    <div class="form-group">
      <input id="auth-username" class="form-input" type="text" placeholder="帳號（英數字）" autocomplete="username">
    </div>
    <div class="form-group">
      <input id="auth-password" class="form-input" type="password" placeholder="密碼" autocomplete="current-password">
    </div>
    <div id="auth-register-fields" class="hidden">
      <div class="form-group">
        <input id="auth-name" class="form-input" type="text" placeholder="顯示名稱">
      </div>
      <div class="form-group">
        <select id="auth-city" class="form-input">
          <option value="">選擇所在城市</option>
          <optgroup label="六都">
            <option>台北市</option><option>新北市</option><option>桃園市</option>
            <option>台中市</option><option>台南市</option><option selected>高雄市</option>
          </optgroup>
          <optgroup label="其他縣市">
            <option>基隆市</option><option>新竹市</option><option>嘉義市</option>
            <option>新竹縣</option><option>苗栗縣</option><option>彰化縣</option>
            <option>南投縣</option><option>雲林縣</option><option>嘉義縣</option>
            <option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option>
            <option>台東縣</option><option>澎湖縣</option><option>金門縣</option><option>連江縣</option>
          </optgroup>
        </select>
      </div>
    </div>
    <button id="auth-submit" class="btn-primary">進入</button>
    <div id="auth-error" class="auth-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div id="view-container">

    <!-- Map View -->
    <div id="map-view" class="view active">
      <div id="map-filters-wrap">
        <div id="map-filters"></div>
        <button id="filter-drawer-btn" class="filter-more-btn" title="篩選">⚙️</button>
      </div>
      <div id="map"></div>
      <div id="map-drag-handle"><div class="drag-handle-bar"></div></div>
      <div id="ptr-indicator" class="hidden">↓ 下拉刷新</div>
      <div id="map-scroll">
        <div id="stats-bar">
          <div class="stat-item">
            <div class="stat-num red" id="stat-total">—</div>
            <div class="stat-label">全台排雷點</div>
          </div>
          <div class="stat-item">
            <div class="stat-num blue" id="stat-verified">—</div>
            <div class="stat-label">已驗證</div>
          </div>
          <div class="stat-item">
            <div class="stat-num green" id="stat-fixed">—</div>
            <div class="stat-label">已修復</div>
          </div>
        </div>
        <div id="map-search-wrap" class="hidden">
          <input id="map-search" class="form-input" type="search" placeholder="搜尋危險點標題或地址…">
        </div>
        <div id="nearby-list"></div>
      </div>
    </div>

    <!-- Community View -->
    <div id="community-view" class="view">
      <div class="community-header">
        <h2>社群附議</h2>
        <div id="community-filter-bar"></div>
      </div>
      <div id="community-list"></div>
      <div id="community-load-more" class="hidden">
        <button id="load-more-btn" class="btn-secondary" style="margin:8px 14px 0;width:calc(100% - 28px)">載入更多</button>
      </div>
    </div>

    <!-- Achievements View -->
    <div id="achievements-view" class="view">
      <h2>成就</h2>
      <div id="achievements-content"></div>
    </div>

    <!-- Profile View -->
    <div id="profile-view" class="view">
      <div id="profile-content" style="padding:16px 16px 80px"></div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="map">
      <span class="icon">🗺️</span>地圖
    </button>
    <button class="nav-btn" data-view="community">
      <span class="icon">💬</span>社群<span id="community-badge" class="nav-badge hidden"></span>
    </button>
    <button class="nav-btn" data-view="achievements">
      <span class="icon">🏅</span>成就
    </button>
    <button class="nav-btn" data-view="profile">
      <span class="icon">👤</span>我的
    </button>
  </nav>
</div>

<!-- FAB -->
<button id="fab" class="hidden">回報</button>

<!-- Report Modal -->
<div id="report-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title">回報缺陷</div>
      <button id="report-modal-close" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label form-label-required">缺陷類別</label>
      <div id="report-cat-grid" class="cat-grid"></div>
    </div>

    <div class="form-group">
      <label class="form-label">標題（選填，留空自動產生）</label>
      <input id="report-title" class="form-input" type="text" placeholder="簡短描述此缺陷…" maxlength="60">
    </div>

    <div class="form-group">
      <label class="form-label">嚴重程度</label>
      <div class="severity-row">
        <button class="sev-btn" data-sev="1">1<br><small>輕微</small></button>
        <button class="sev-btn" data-sev="2">2<br><small>輕度</small></button>
        <button class="sev-btn active" data-sev="3">3<br><small>中度</small></button>
        <button class="sev-btn" data-sev="4">4<br><small>嚴重</small></button>
        <button class="sev-btn" data-sev="5">5<br><small>極危</small></button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">描述（選填）</label>
      <textarea id="report-desc" class="form-input" placeholder="簡短描述缺陷情況…"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">現場照片（選填）</label>
      <button id="report-photo-btn" class="btn-secondary" style="margin-top:0">📷 上傳照片</button>
      <input id="report-photo-input" type="file" accept="image/*" style="display:none">
      <div id="report-photo-preview"></div>
    </div>

    <div id="gps-status" class="gps-status"></div>
    <button id="report-submit" class="btn-primary">送出回報</button>
  </div>
</div>

<!-- Hazard Detail Modal -->
<div id="hazard-detail-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="modal-title" id="hazard-detail-title">危險點詳情</div>
      <button id="hazard-detail-close" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div id="hazard-detail-content"></div>
  </div>
</div>

<!-- Edit Hazard Modal -->
<div id="edit-hazard-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title">編輯回報</div>
      <button id="edit-hazard-close" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">標題</label>
      <input id="edit-hazard-title" class="form-input" type="text" maxlength="80">
    </div>
    <div class="form-group">
      <label class="form-label">描述</label>
      <textarea id="edit-hazard-desc" class="form-input" style="height:80px"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">嚴重程度</label>
      <div class="severity-row" id="edit-sev-row">
        <button class="sev-btn" data-sev="1">1<br><small>輕微</small></button>
        <button class="sev-btn" data-sev="2">2<br><small>輕度</small></button>
        <button class="sev-btn" data-sev="3">3<br><small>中度</small></button>
        <button class="sev-btn" data-sev="4">4<br><small>嚴重</small></button>
        <button class="sev-btn" data-sev="5">5<br><small>極危</small></button>
      </div>
    </div>
    <button id="edit-hazard-save" class="btn-primary">儲存變更</button>
  </div>
</div>

<!-- Filter Drawer -->
<div id="filter-drawer" class="modal-overlay hidden">
  <div class="modal-sheet" style="max-height:75dvh">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title">篩選條件</div>
      <button id="filter-drawer-close" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">類別</label>
      <div id="drawer-cat-grid" class="cat-grid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">狀態</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="drawer-status-btns">
        <button class="filter-status-btn active" data-status="all">全部</button>
        <button class="filter-status-btn" data-status="pending">待審</button>
        <button class="filter-status-btn" data-status="verified">已驗證</button>
        <button class="filter-status-btn" data-status="fixed">已修復</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">排序方式</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="drawer-sort-btns">
        <button class="filter-status-btn active" data-sort="time">最新優先</button>
        <button class="filter-status-btn" data-sort="distance">距離最近</button>
        <button class="filter-status-btn" data-sort="severity">最嚴重</button>
      </div>
    </div>
    <button id="filter-apply-btn" class="btn-primary" style="margin-top:8px">套用篩選</button>
    <button id="filter-reset-btn" class="btn-secondary">重置</button>
  </div>
</div>

<!-- All Hazards Modal -->
<div id="all-hazards-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="modal-title">全部排雷點 <span id="all-hazards-count" style="font-size:13px;font-weight:400;color:var(--text3)"></span></div>
      <button id="all-hazards-close" style="background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div style="margin-bottom:12px">
      <input id="all-hazards-search" class="form-input" type="search" placeholder="搜尋標題或地址…">
    </div>
    <div id="all-hazards-list"></div>
  </div>
</div>

<!-- Share Modal -->
<div id="share-modal" class="modal-overlay hidden">
  <div class="modal-sheet" style="max-height:50dvh">
    <div class="modal-handle"></div>
    <div class="modal-title" style="margin-bottom:14px">分享危險點</div>
    <div id="share-url-box" class="share-url-box"></div>
    <button id="share-copy-btn" class="btn-primary" style="margin-top:12px">複製連結</button>
    <button id="share-close-btn" class="btn-secondary">關閉</button>
  </div>
</div>

<!-- Map pick bar（地圖選點模式）-->
<div id="map-pick-bar" class="hidden">
  <div class="pick-hint">👆 點地圖任一處設定回報位置</div>
  <div class="pick-actions">
    <button class="pick-center-btn" onclick="confirmMapPick()">用地圖中心</button>
    <button class="pick-cancel-btn" onclick="cancelMapPick()">取消</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/map.js"></script>
<script src="/js/community.js"></script>
<script src="/js/achievements.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
